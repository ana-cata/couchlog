# Couchlog as it runs on the Pi: two containers from one image, sharing the database in a volume.
# Start it with: docker compose up --build
services:
  couchlog:
    build:
      context: .
      # The build uses the machine's own network. On the Pi the build could not look up the Python packages' site without it.
      network: host
      # Docker wants permission before a build uses the machine's network. This gives it, for the build only.
      entitlements:
        - network.host
    # A name for the image, so `daily` below uses this same one.
    image: couchlog
    # The app is at http://localhost:3000 (on the Pi: http://<pi-address>:3000). It listens on 8000 inside.
    ports:
      - "3000:8000"
    # The secrets and settings come from .env when the container starts. The file is not copied into the image.
    env_file: .env
    # These win over .env: debug is always off here, and the database lives in the volume.
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_DB_PATH: /data/db.sqlite3
    volumes:
      - couchlog-data:/data
    # Starts again by itself after a crash, and when the Pi restarts.
    restart: unless-stopped

  # The daily task: refreshes the calendar when it starts and then every 24 hours. See it with: docker compose logs daily
  daily:
    image: couchlog
    command: python manage.py run_daily
    # The same settings and the same database as the app.
    env_file: .env
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_DB_PATH: /data/db.sqlite3
    volumes:
      - couchlog-data:/data
    # Lets `docker compose down` stop it at once instead of after 10 seconds.
    init: true
    # Starting by itself when the Pi restarts is what makes it refresh after the Pi was off.
    restart: unless-stopped

# A named volume (kept by Docker, not a folder on the PC), so rebuilding the container does not erase the database.
# `docker compose down` keeps it. `docker compose down -v` deletes it.
volumes:
  couchlog-data:
