[project]
name = "couchlog"
version = "0.1.0"
description = "Track the movies and series you watch"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "pytest-playwright>=0.10.0",
    "respx>=0.23.1",
    "ruff>=0.17.3",
    "time-machine>=3.6.0",
]

[tool.ruff]
# Migration files are written by Django, so the lint does not check them.
extend-exclude = ["*/migrations/*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
# WhiteNoise warns when the staticfiles folder is missing, which is normal on the PC (see config/settings.py).
filterwarnings = ["ignore:No directory at"]
