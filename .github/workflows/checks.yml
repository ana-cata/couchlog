name: Checks

# Runs on every pull request: lint, then tests. There is no build step.
on:
  pull_request:

# Read-only: the checks only read the code. A pull request from a copy of the repo (a fork) gets no secrets either.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs uv. It reads the Python version from .python-version.
      # This action has no short "v10" tag, so the exact version is used.
      - uses: astral-sh/setup-uv@v10.3.3

      # --locked fails if uv.lock does not match pyproject.toml.
      - run: uv sync --locked

      - run: uv run ruff check .

      # The end-to-end test drives a real browser (Chromium); this downloads it. GitHub's Ubuntu
      # machine already has the Linux libraries Chromium needs (it comes with Chrome), so they are
      # not installed from Ubuntu's servers: when those servers did not answer (2026-11-11), the
      # whole check failed before any test ran.
      - run: uv run playwright install chromium

      # No .env and no TMDB key here: the tests use made-up TMDB answers.
      - run: uv run pytest
