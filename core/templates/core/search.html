{% extends 'core/base.html' %}

{% block title %}Search · Couchlog{% endblock %}

{% block content %}
  <h1>Search</h1>

  {# Works without JavaScript too: Enter sends the form. With htmx, results appear as you type. #}
  <form action="{% url 'search' %}" method="get" role="search">
    <input type="search" name="q" value="{{ query }}" placeholder="Search movies and series"
           aria-label="Search movies and series" autocomplete="off" autofocus
           hx-get="{% url 'search' %}" hx-trigger="input changed delay:400ms, search"
           hx-target="#results" hx-replace-url="true" hx-sync="this:replace">
  </form>

  <div id="results" aria-live="polite">
    {% include 'core/_search_results.html' %}
  </div>
{% endblock %}
