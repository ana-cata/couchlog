{# The tabs under a section's heading. `section` is "movies" or "series"; `tab` is the one showing. #}
<nav class="tabs" aria-label="{{ section|capfirst }}">
  <ul>
    {% if section == 'movies' %}
      <li><a href="{% url 'movies' %}"{% if tab == 'to_watch' %} aria-current="page"{% endif %}>To Watch</a></li>
      <li><a href="{% url 'history' %}"{% if tab == 'history' %} aria-current="page"{% endif %}>History</a></li>
    {% else %}
      <li><a href="{% url 'series' %}"{% if tab == 'to_watch' %} aria-current="page"{% endif %}>To Watch</a></li>
      <li><a href="{% url 'series_watching' %}"{% if tab == 'watching' %} aria-current="page"{% endif %}>Watching</a></li>
      <li><a href="{% url 'series_finished' %}"{% if tab == 'finished' %} aria-current="page"{% endif %}>Finished</a></li>
    {% endif %}
  </ul>
</nav>
