{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Couchlog{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'core/pico.min.css' %}">
  <link rel="stylesheet" href="{% static 'core/couchlog.css' %}">
  <script src="{% static 'core/htmx.min.js' %}" defer></script>
</head>
<body>
  <header class="container">
    <nav>
      <ul>
        <li><strong><a href="{% url 'home' %}" class="contrast">Couchlog</a></strong></li>
      </ul>
      {% if user.is_authenticated %}
        <ul>
          <li><a href="{% url 'search' %}">Search</a></li>
          <li><a href="{% url 'profile' %}">Profile</a></li>
        </ul>
      {% endif %}
    </nav>
  </header>
  <main class="container">
    {% for message in messages %}
      <p role="status">{{ message }}</p>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
  <footer class="container">
    <small><a href="{% url 'about' %}">About</a></small>
  </footer>
</body>
</html>
