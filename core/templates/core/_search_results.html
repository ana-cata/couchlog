{% if error %}
  <p role="alert">{{ error }}</p>
{% elif query and not results %}
  <p>No movies or series match “{{ query }}”.</p>
{% elif results %}
  <ul class="results">
    {% for result in results %}
      {% include 'core/_tile.html' with tile=result on_list=result.on_list live=True %}
    {% endfor %}
  </ul>
{% endif %}
