{# What a season or "up to here" press says, with Undo while there is something to undo. #}
{# It is shown inside #bulk-notice, which stays at the bottom of the window so it is seen even deep in a long season. #}
{% if text %}
  <div class="bulk-notice">
    <span>{{ text }}</span>
    {% if batch %}
      <form method="post" action="{% url 'watched_batch_remove' %}"
            hx-post="{% url 'watched_batch_remove' %}" hx-target="#bulk-notice" hx-swap="innerHTML">
        {% csrf_token %}
        <input type="hidden" name="batch" value="{{ batch }}">
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="outline secondary">Undo</button>
      </form>
    {% endif %}
  </div>
{% endif %}
